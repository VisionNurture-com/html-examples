<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>境界あり（Shadow の中で外部 CSS を読む）</title>
<style>
  body { color: rebeccapurple; font-family: Georgia, serif }
  .label { border-bottom: 4px solid green }
  my-card::part(title) { text-decoration: underline }
  my-card { --card-accent: green }
</style>
</head>
<body>
  <h1>Shadow の中から link で外部 CSS を読む</h1>
  <my-card id="target">お知らせ</my-card>

<script>
  class MyCard extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: 'open' });
      // 境界の中でも link は使える。読み込み完了を待ってから ready にする
      root.innerHTML = `
        <link rel="stylesheet" href="./g-inner.css">
        <span class="label" part="title" id="probe">${this.textContent}</span>`;
      const link = root.querySelector('link');
      const done = () => { this.dataset.ready = '1'; };
      if (link.sheet) done(); else link.addEventListener('load', done, { once: true });
    }
  }
  customElements.define('my-card', MyCard);
</script>
</body>
</html>
