<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>境界あり（CSS カスタムプロパティで受け取る）</title>
<style>
  body { color: rebeccapurple; font-family: Georgia, serif }
  .label { border-bottom: 4px solid green }
  my-card::part(title) { text-decoration: underline }
  my-card { --card-accent: green }
</style>
</head>
<body>
  <h1>変数を受け取り口にする</h1>
  <my-card id="target">お知らせ</my-card>

<script>
  class MyCard extends HTMLElement {
    connectedCallback() {
      const root = this.attachShadow({ mode: 'open' });
      // 部品側が変数を読む。渡されなければ第 2 引数の既定値を使う
      root.innerHTML = `
        <style>
          .label { border-bottom: 4px solid var(--card-accent, #999) }
        </style>
        <span class="label" id="probe">${this.textContent}</span>`;
      this.dataset.ready = '1';
    }
  }
  customElements.define('my-card', MyCard);
</script>
</body>
</html>
