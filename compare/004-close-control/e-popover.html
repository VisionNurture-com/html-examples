<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>popover（light dismiss）</title>
<style>
  body { margin: 0; padding: 1rem; height: 300vh }
  [popover] { border: 2px solid #333; padding: 1rem }
</style>
</head>
<body>
  <!-- popovertarget を書くだけで開閉する。JavaScript は要らない -->
  <button type="button" id="open" popovertarget="box">開く</button>
  <!-- popover="auto" は外側クリックと Esc の両方で閉じる（light dismiss） -->
  <!-- aria-label は role を持たない div には使えない。ラベルは中身の見出しで与える -->
  <div id="box" popover="auto">
    <p id="label">確認</p>
    <button type="button" id="ok">OK</button>
    <button type="button" id="ng" popovertarget="box" popovertargetaction="hide">やめる</button>
  </div>
  <!-- popover は後ろのページを触れなくしないため、このリンクは開いている間も押せる -->
  <a href="#end" id="after">ページ末尾へ</a>
  <p id="end">末尾</p>
</body>
</html>
