<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>自作モーダル（div）</title>
<style>
  body { margin: 0; padding: 1rem; height: 300vh }
  #box { display: none; position: fixed; inset: 30% 20%; background: #fff; border: 2px solid #333; padding: 1rem }
  #box[data-open] { display: block }
</style>
</head>
<body>
  <button type="button" id="open">開く</button>
  <!-- div は最前面に出る仕組みを持たないため、後ろのページのリンクやボタンはそのまま押せる -->
  <div id="box" role="dialog" aria-modal="true" aria-label="確認">
    <button type="button" id="ok">OK</button>
    <button type="button" id="ng">やめる</button>
  </div>
  <!-- モーダルより後ろに置く。ここへ Tab が届くかどうかが「後ろのページへ抜けたか」の見どころになる -->
  <a href="#end" id="after">ページ末尾へ</a>
  <p id="end">末尾</p>
<script>
  const box = document.getElementById('box');
  document.getElementById('open').onclick = () => box.setAttribute('data-open', '');
  // 閉じる手段は「やめる」ボタンだけ。Esc も外側クリックも書いていない
  document.getElementById('ng').onclick = () => box.removeAttribute('data-open');
</script>
</body>
</html>
