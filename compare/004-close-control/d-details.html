<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>details（開閉表示）</title>
<style>
  body { margin: 0; padding: 1rem; height: 300vh }
  details { border: 2px solid #333; padding: 1rem; max-width: 20rem }
</style>
</head>
<body>
  <!-- summary が開くトリガーを兼ねる。開いた状態で出したいときは open を書く -->
  <details id="box">
    <summary id="open">開く</summary>
    <button type="button" id="ok">OK</button>
    <button type="button" id="ng">やめる</button>
  </details>
  <!-- 開いても後ろのページは覆われないため、このリンクは常に押せる -->
  <a href="#end" id="after">ページ末尾へ</a>
  <p id="end">末尾</p>
<script>
  // 閉じる処理を書く必要はない。summary をもう一度押せば閉じる
  document.getElementById('ng').onclick = () => document.getElementById('box').removeAttribute('open');
</script>
</body>
</html>
