<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>定義は head・DOMContentLoaded を待つ</title>
<script>
  class MyList extends HTMLElement {
    connectedCallback() {
      // 解析完了のイベントを待つ
      document.addEventListener('DOMContentLoaded', () => this.count());
    }
    count() {
      this.dataset.counted = String(this.querySelectorAll('li').length);
    }
  }
  customElements.define('my-list', MyList);
</script>
</head>
<body>
  <h1>定義は head・DOMContentLoaded を待つ</h1>

  <my-list id="target">
    <ul>
      <li>りんご</li>
      <li>みかん</li>
      <li>ぶどう</li>
    </ul>
  </my-list>

</body>
</html>
