<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C 実装: 4 枚すべてに fetchpriority="high"</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; line-height: 1.7; }
main { max-inline-size: 60rem; margin-inline: auto; padding: 1rem; }
img { max-inline-size: 100%; block-size: auto; display: block; }
.below { margin-block-start: 120vh; }
</style>
</head>
<body>
<main>
<h1>実装 C — 4 枚すべてに fetchpriority="high"</h1>
<!-- 「1 ページに 1 つだけ」という通説の検証用。画面外の 3 枚にも同じヒントを付ける -->
<img src="../images/hero.jpg" alt="主役の画像" width="1600" height="900" fetchpriority="high">
<div class="below">
  <img src="../images/thumb-1.jpg" alt="画面外の画像 1" width="800" height="500" fetchpriority="high">
  <img src="../images/thumb-2.jpg" alt="画面外の画像 2" width="800" height="500" fetchpriority="high">
  <img src="../images/thumb-3.jpg" alt="画面外の画像 3" width="800" height="500" fetchpriority="high">
</div>
</main>
</body>
</html>
