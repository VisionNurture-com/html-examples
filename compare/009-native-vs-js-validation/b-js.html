<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B: JS 検証併用</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.7; }
label { display: block; margin-block-start: 0.8rem; font-weight: bold; }
input { padding: 0.4rem; inline-size: 18rem; }
input[aria-invalid="true"] { border-color: #c00; }
.error { color: #c00; min-height: 1.4em; }
button { margin-block-start: 1rem; padding: 0.4rem 1.2rem; }
</style>
</head>
<body>
<main>
<h1>お問い合わせ（B: JS 検証併用）</h1>
<form id="contact" method="post" novalidate>
  <label for="name">お名前（必須）</label>
  <input type="text" id="name" name="name" aria-describedby="name-error" autocomplete="name">
  <p class="error" id="name-error" aria-live="polite"></p>
  <label for="email">メールアドレス（必須）</label>
  <input type="email" id="email" name="email" aria-describedby="email-error" autocomplete="email">
  <p class="error" id="email-error" aria-live="polite"></p>
  <label for="tel">電話番号（半角数字 10〜11 桁）</label>
  <input type="tel" id="tel" name="tel" aria-describedby="tel-error" autocomplete="tel">
  <p class="error" id="tel-error" aria-live="polite"></p>
  <button type="submit">送信する</button>
</form>
<script>
const rules = {
  name: (v) => (v.trim() ? '' : 'お名前を入力してください'),
  email: (v) => (/^[^@\s]+@[^@\s]+$/.test(v) ? '' : 'メールアドレスの形式で入力してください'),
  tel: (v) => (!v || /^[0-9]{10,11}$/.test(v) ? '' : '半角数字 10〜11 桁で入力してください')
};
const check = (id) => {
  const field = document.getElementById(id);
  const message = rules[id](field.value);
  document.getElementById(id + '-error').textContent = message;
  field.setAttribute('aria-invalid', message ? 'true' : 'false');
  return !message;
};
Object.keys(rules).forEach((id) => {
  document.getElementById(id).addEventListener('input', () => check(id));
});
document.getElementById('contact').addEventListener('submit', (event) => {
  if (Object.keys(rules).map(check).includes(false)) {
    event.preventDefault();
    document.querySelector('[aria-invalid="true"]').focus();
  }
});
</script>
</main>
</body>
</html>
