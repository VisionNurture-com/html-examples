<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>保存したのに変わらない（fixed）</title>
<!-- CSS を更新したら参照の URL も変える。URL が変われば別のファイルとして
     取り直されるため、読者の画面にも新しい見た目が届く -->
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<main>
<h1>今週のお知らせ</h1>
<p class="lead">CSS を書き換えると、この行の色も変わります。</p>
</main>
</body>
</html>
