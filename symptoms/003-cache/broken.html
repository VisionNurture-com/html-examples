<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>保存したのに変わらない（broken）</title>
<!-- ここが原因: 参照が毎回同じ URL なので、ブラウザは手元に持っている
     古い style.css をそのまま使う。CSS を書き換えても読者の画面は変わらない -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
<h1>今週のお知らせ</h1>
<p class="lead">CSS を書き換えても、この行の色は古いままです。</p>
</main>
</body>
</html>
