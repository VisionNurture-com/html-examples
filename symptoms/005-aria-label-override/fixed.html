<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>見えている文字で探せるボタン</title>
  </head>
  <body>
    <main>
      <h1>申し込みの確認</h1>
      <!-- aria-label に見えている文字「申し込む」を含める。
           補足を足しても、画面の文字で探す人が名前をたどれる -->
      <button type="button" aria-label="申し込む（確認画面へ）">申し込む</button>
    </main>
  </body>
</html>
