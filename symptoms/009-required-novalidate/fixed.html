<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>required を付けたのに送信できる（fixed: 送信ボタンに戻す）</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.7; }
label { display: block; font-weight: bold; }
input { padding: 0.4rem; inline-size: 18rem; }
button { margin-block-start: 1rem; padding: 0.4rem 1.2rem; }
</style>
</head>
<body>
<main>
<h1>お問い合わせ</h1>
<form method="post">
  <label for="email">メールアドレス（必須）</label>
  <input type="email" id="email" name="email" required autocomplete="email">
  <!-- 送信ボタンに戻すだけで検証が働く。JS は要らない -->
  <button type="submit">送信する</button>
</form>
</main>
</body>
</html>
