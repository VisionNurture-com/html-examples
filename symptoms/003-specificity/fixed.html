<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>一部だけ効かない（fixed）</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.7; }
/* 見た目の指定を id から class へ移す。詳細度がそろうため、
   後に書いた .alert が勝つ。!important を足す必要はない */
.notice { color: #1d4ed8; }
.alert { color: #b91c1c; }
</style>
</head>
<body>
<main>
<h1>今週のお知らせ</h1>
<p id="notice" class="notice alert">この行は指定どおり赤になります。</p>
<p class="alert">この行も赤のままです。</p>
</main>
</body>
</html>
