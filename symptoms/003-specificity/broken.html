<!DOCTYPE html>
<html lang="ja">
<head>

<title>一部だけ効かない（broken）</title>

.alert { color: #b91c1c; }
</style>
</head>
<body>
<main>
<h1>今週のお知らせ</h1>
<p id="notice" class="alert">この行は赤にしたいのに、青のままです。</p>
<p class="alert">この行は指定どおり赤になります。</p>
</main>
</body>
</html>
