<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>閉じられるモーダル</title>
<style>
  body { margin: 0; padding: 1rem; height: 300vh }
  dialog { border: 2px solid #333; padding: 1rem }
  /* 後ろのページのスクロールは showModal() では止まらないため、ここで止める */
  body:has(dialog[open]) { overflow: hidden }
</style>
</head>
<body>
  <button type="button" id="open">削除する</button>
  <!-- closedby="any" で Esc と外側クリックの両方を許す。この指定を読まないブラウザでは Esc だけで閉じる -->
  <dialog id="box" closedby="any" aria-label="削除の確認">
    <p>このタスクを削除しますか？</p>
    <button type="button" id="ng">やめる</button>
  </dialog>
  <a href="#end" id="after">ページ末尾へ</a>
  <p id="end">末尾</p>
<script>
  const box = document.getElementById('box');
  document.getElementById('open').onclick = () => box.showModal();
  document.getElementById('ng').onclick = () => box.close();
</script>
</body>
</html>
