<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>見出しの階層が飛ぶページ</title>
  </head>
  <body>
    <!-- ここが原因 1: main が 2 つある。支援技術は「主要な領域」を 1 つに絞れない -->
    <main>
      <h1>サポート窓口のご案内</h1>
      <!-- ここが原因 2: h1 の次が h3。見出しの階層に h2 の段が無い -->
      <h3>受付時間</h3>
      <p>平日 9 時から 17 時まで受け付けます。</p>
      <h3>連絡先</h3>
      <p>support@example.com までお送りください。</p>
    </main>
    <main>
      <!-- ここが原因 3: 2 つ目の main の中で h1 が再び現れる -->
      <h1>よくある質問</h1>
      <h4>返信までどのくらいかかりますか</h4>
      <p>2 営業日以内にお返しします。</p>
    </main>
  </body>
</html>
