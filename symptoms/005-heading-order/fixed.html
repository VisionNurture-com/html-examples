<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>見出しの階層をつないだページ</title>
  </head>
  <body>
    <!-- main は 1 つだけにする。支援技術の「主要な領域へ移動」が 1 か所に定まる -->
    <main>
      <h1>サポート窓口のご案内</h1>
      <!-- h1 の次は h2。段を飛ばさないので、見出し単位の移動で迷子にならない -->
      <h2>受付時間</h2>
      <p>平日 9 時から 17 時まで受け付けます。</p>
      <h2>連絡先</h2>
      <p>support@example.com までお送りください。</p>
      <!-- 2 つ目の h1 だった節は、同じ main の中の h2 として並べる -->
      <h2>よくある質問</h2>
      <h3>返信までどのくらいかかりますか</h3>
      <p>2 営業日以内にお返しします。</p>
    </main>
  </body>
</html>
