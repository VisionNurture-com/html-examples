<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>押せない人が出るページ</title>
    <style>
      .btn { display: inline-block; padding: 8px 16px; background: #2b6cb0; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>申し込みの確認</h1>
      <p id="status">まだ送信していません。</p>
      <!-- ここが原因: 見た目はボタンだが div のまま。
           マウスでは押せるため、書いた本人は不具合に気づけない -->
      <div class="btn" onclick="send()">送信する</div>
    </main>
    <script>
      function send() {
        document.getElementById('status').textContent = '送信しました。';
      }
    </script>
  </body>
</html>
