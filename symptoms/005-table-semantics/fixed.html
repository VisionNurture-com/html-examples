<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>表の見出しを伝えるページ</title>
  </head>
  <body>
    <main>
      <h1>担当者ごとの受付件数</h1>
      <!-- caption は表の名前。支援技術へ渡る表の名前になる -->
      <table>
        <caption>担当者ごとの受付件数（2026 年 4 月・5 月）</caption>
        <thead>
          <tr>
            <!-- scope="col" は「この列の見出し」。見出しが掛かる向きを明示する -->
            <th scope="col">担当</th>
            <th scope="col">4 月</th>
            <th scope="col">5 月</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <!-- scope="row" は「この行の見出し」。向きを明示する -->
            <th scope="row">Alice</th>
            <td>12</td>
            <td>18</td>
          </tr>
          <tr>
            <th scope="row">Bob</th>
            <td>9</td>
            <td>21</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
